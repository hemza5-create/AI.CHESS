name: Deno

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno linter
        run: deno lint src/ server.ts

      - name: Run TypeScript check and build
        run: |
          npm run lint
          npm run build

      - name: Run Deno tests
        run: deno test --allow-all --permit-no-files
