name: Build Capacitor Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies without lockfile
        run: npm install --package-lock=false

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build web project
        env:
          VITE_EXTERNAL_SERVER_URL: ${{ vars.VITE_EXTERNAL_SERVER_URL }}
          VITE_EXTERNAL_SERVER_ID: ${{ vars.VITE_EXTERNAL_SERVER_ID || 'cvsu-uci-core-v2' }}
          VITE_API_ROUTE_BOARD_SCAN: ${{ vars.VITE_API_ROUTE_BOARD_SCAN || '/api/v2/vision/scan-board' }}
          VITE_API_ROUTE_EXPLAIN: ${{ vars.VITE_API_ROUTE_EXPLAIN || '/api/v2/coach/explain' }}
          VITE_API_ROUTE_TTS: ${{ vars.VITE_API_ROUTE_TTS || '/api/v2/coach/synthesize' }}
          VITE_API_ROUTE_OWNERSHIP: ${{ vars.VITE_API_ROUTE_OWNERSHIP || '/api/v2/vault/ownership' }}
          VITE_API_ROUTE_ENGINE_HEALTH: ${{ vars.VITE_API_ROUTE_ENGINE_HEALTH || '/api/v2/engine/health' }}
          VITE_API_ROUTE_ENGINE_VERSION: ${{ vars.VITE_API_ROUTE_ENGINE_VERSION || '/api/v2/engine/version' }}
          VITE_API_ROUTE_ENGINE_AUTO_UPDATE: ${{ vars.VITE_API_ROUTE_ENGINE_AUTO_UPDATE || '/api/v2/engine/auto-update' }}
          VITE_GCP_CLOUD_URL: ${{ vars.VITE_GCP_CLOUD_URL }}
          VITE_GCP_CLOUD_REGION: ${{ vars.VITE_GCP_CLOUD_REGION || 'europe-west2' }}
          VITE_AWS_CLOUD_URL: ${{ vars.VITE_AWS_CLOUD_URL }}
          VITE_AWS_CLOUD_REGION: ${{ vars.VITE_AWS_CLOUD_REGION || 'eu-west-1' }}
        run: npm run build

      - name: Install Capacitor CLI and Core
        run: npm install --package-lock=false @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor and add Android platform
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "AI Chess" "com.hemza.aichess" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

